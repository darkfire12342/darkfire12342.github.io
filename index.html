<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senin İçin ❤️</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        background:linear-gradient(135deg,#ff9a9e,#fad0c4);
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
    }

    .card{
        background:white;
        padding:40px;
        border-radius:25px;
        text-align:center;
        max-width:500px;
        box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    h1{
        color:#ff4d6d;
        margin-bottom:15px;
    }

    p{
        color:#444;
        line-height:1.7;
        margin-bottom:20px;
    }

    button{
        background:#ff4d6d;
        color:white;
        border:none;
        padding:12px 25px;
        border-radius:50px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        transform:scale(1.05);
    }

    #message{
        margin-top:20px;
        color:#ff4d6d;
        font-weight:bold;
        font-size:18px;
    }

    .heart{
        position:absolute;
        color:white;
        font-size:20px;
        animation:fall 6s linear infinite;
    }

    @keyframes fall{
        from{
            transform:translateY(-100px);
        }
        to{
            transform:translateY(110vh);
        }
    }
</style>
</head>
<body>

<div class="card">
    <h1>❤️ Sana Bir Mesajım Var ❤️</h1>

    <p>
        Hayatıma renk kattığın için teşekkür ederim.
        Gülüşün en kötü günleri bile güzelleştiriyor.
        İyi ki varsın. 🌹
    </p>

    <button onclick="showMessage()">Tıkla ✨</button>

    <div id="message"></div>
</div>

<script>
function showMessage(){
    document.getElementById("message").innerHTML =
    "Seni çok seviyorum ❤️";
}

for(let i=0;i<30;i++){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*4+3)+"s";
    heart.style.opacity=Math.random();
    document.body.appendChild(heart);
}
</script>

</body>
</html>
