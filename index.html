<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betül'e ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#4c1d95);
    overflow:hidden;
}

.card{
    width:90%;
    max-width:550px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);
    border-radius:25px;
    padding:35px;
    text-align:center;
    color:white;
    box-shadow:0 0 30px rgba(255,255,255,.15);
}

h1{
    margin-bottom:15px;
    color:#ffd6e7;
}

p{
    line-height:1.8;
    margin-bottom:20px;
}

button{
    border:none;
    background:#ff4d8d;
    color:white;
    padding:12px 28px;
    border-radius:40px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    transform:scale(1.05);
}

#surprise{
    margin-top:20px;
    font-size:18px;
    color:#ffd6e7;
}

.star{
    position:absolute;
    color:white;
    animation:twinkle 3s infinite;
}

@keyframes twinkle{
    50%{opacity:.2;}
}
</style>
</head>
<body>

<div class="card">
    <h1>🌙 Betül'e Bir Mektup</h1>

    <p>
        Bazen bir insanın hayatına gelişi her şeyi değiştirir.
        Sen de benim için öyle birisin Betül.
        En güzel anılarımda, en mutlu gülüşlerimde ve aklıma gelen
        en güzel şeylerde hep biraz sen varsın. ❤️
    </p>

    <button onclick="ac()">Mesajı Aç ✨</button>

    <div id="surprise"></div>
</div>

<script>
function ac(){
document.getElementById("surprise").innerHTML =
"❤️ İyi ki varsın Betül. Bu küçük site bile sana anlatmak istediklerimin yanında çok küçük kalıyor. ❤️";
}

for(let i=0;i<60;i++){
 let s=document.createElement("div");
 s.className="star";
 s.innerHTML="✦";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 s.style.fontSize=(Math.random()*15+8)+"px";
 s.style.animationDelay=Math.random()*3+"s";
 document.body.appendChild(s);
}
</script>

</body>
</html>
